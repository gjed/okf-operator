name: Image

# Fires because release.yml creates the release with the gjed-release app
# token; releases created with GITHUB_TOKEN do not trigger workflows. To rebuild
# an image, re-run this workflow's run for that release from the Actions UI.
on:
  release:
    types:
      - published

# No token scopes by default; each job declares the minimum it uses.
permissions: {}

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/gjed/okf-operator
          # latest=auto adds `latest` for semver tags.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}

  publish-chart:
    name: Package and push chart
    runs-on: ubuntu-latest
    needs: image
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          # renovate: datasource=github-releases depName=helm/helm
          version: v4.3.2

      - name: Package chart
        # The chart and the image share the release version: the tag without
        # its leading v, which is also the image tag. Chart.yaml in the
        # repository keeps placeholders.
        run: |
          VERSION="${RELEASE_TAG#v}"
          helm package deploy/chart \
            --version "$VERSION" \
            --app-version "$VERSION" \
            --destination "$RUNNER_TEMP"

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GITHUB_TOKEN"

      - name: Push chart
        run: helm push "$RUNNER_TEMP"/okf-operator-*.tgz oci://ghcr.io/gjed/charts
