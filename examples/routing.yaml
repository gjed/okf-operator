# Routing map, version 1. Copy to .kb/routing.yaml in the knowledge repo.
# Schema: docs/routing.md
version: 1
sources:
  - repo: acme/api
    bundle: product
    exclude: ["**/secrets/**", "**/*.pem"]
    routes:
      - page: product/services/api.md
        paths: ["api/**", "cmd/server/**"]
      - page: product/services/billing.md
        type: Service # allows creating the page when it does not exist
        paths: ["billing/**"]
  - repo: acme/platform
    bundle: infra
    routes:
      - page: infra/pipelines/deploy.md
        paths: ["deploy/**/*.yaml", ".github/workflows/deploy.yml"]
