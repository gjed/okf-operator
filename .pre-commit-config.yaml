exclude: ^\.opencode/

# Pin Node: the default resolver picks a pre-release for node-based hooks.
default_language_version:
  node: 24.22.3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # pnpm writes a multi-document lockfile that is generated, not hand-edited.
      - id: check-yaml
        exclude: ^(pnpm-lock\.yaml|deploy/.*\.yaml)$
      # Kubernetes manifests hold several documents per file. Helm templates
      # are not YAML until rendered; `helm lint` checks them.
      - id: check-yaml
        name: check yaml (kubernetes manifests)
        files: ^deploy/.*\.yaml$
        exclude: ^deploy/chart/templates/
        args: [--allow-multiple-documents]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.24.1
    hooks:
      - id: markdownlint-cli2
        # Model prompts: Go templates whose exact bytes the model receives.
        exclude: ^prompts/
