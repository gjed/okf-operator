# RBAC for okf-operator controller. Cluster-wide it only reads its own CRDs,
# writes Source status and records events. Secrets are readable by name only,
# in the namespace that holds the KnowledgeBase; list every Secret your
# KnowledgeBases reference in okf-operator-secrets.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: okf-operator
  namespace: okf-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: okf-operator
rules:
  - apiGroups: ["okf.dev"]
    resources: ["knowledgebases", "sources"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["okf.dev"]
    resources: ["sources/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["", "events.k8s.io"]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: okf-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: okf-operator
subjects:
  - kind: ServiceAccount
    name: okf-operator
    namespace: okf-operator
---
# Leader election Lease, in the controller's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: okf-operator-leader-election
  namespace: okf-operator
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: okf-operator-leader-election
  namespace: okf-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: okf-operator-leader-election
subjects:
  - kind: ServiceAccount
    name: okf-operator
    namespace: okf-operator
---
# The Secrets of the sample KnowledgeBase, by name. Repeat this Role in every
# namespace that holds KnowledgeBases.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: okf-operator-secrets
  namespace: okf-operator
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - knowledge-writer-app
      - knowledge-writer-model
      - knowledge-review-app
      - knowledge-review-model
      - knowledge-webhook
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: okf-operator-secrets
  namespace: okf-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: okf-operator-secrets
subjects:
  - kind: ServiceAccount
    name: okf-operator
    namespace: okf-operator
