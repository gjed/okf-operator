# A sample Deployment of okf-operator controller. Pin the image to a release
# tag. One replica is enough: leader election keeps a single active one, and
# only the leader serves the webhook and reports Ready. Keep the Recreate
# strategy: under RollingUpdate a new Pod waits for the Lease the old one
# holds and never becomes Ready.
apiVersion: v1
kind: Namespace
metadata:
  name: okf-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: okf-operator
  namespace: okf-operator
  labels:
    app.kubernetes.io/name: okf-operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: okf-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: okf-operator
    spec:
      serviceAccountName: okf-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: ghcr.io/gjed/okf-operator:latest
          args: ["--log-format", "json", "controller"]
          # Uncomment to export traces and metrics over OTLP.
          # env:
          #   - name: OTEL_EXPORTER_OTLP_ENDPOINT
          #     value: http://otel-collector.observability:4318
          ports:
            - name: webhook
              containerPort: 8080
            - name: probes
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Per-run knowledge checkouts.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
---
# Point the GitHub App webhook (or a repository webhook) at this Service's
# /webhook path through your ingress.
apiVersion: v1
kind: Service
metadata:
  name: okf-operator-webhook
  namespace: okf-operator
spec:
  selector:
    app.kubernetes.io/name: okf-operator
  ports:
    - name: webhook
      port: 80
      targetPort: webhook
